name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # setuptools_scm needs full history/tags
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check, ruff format check
        run: make check-format PYTHON=python
      - name: Pyright
        run: make type-check PYTHON=python

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # The same command you run locally; `PYTHON=python` uses the runner's Python instead of .venv
      - name: Run tests
        run: make test PYTHON=python

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build --sdist --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # tinytab is an example package and is never published. In a real project, this job
  # uploads the built distribution to PyPI when a GitHub Release is published:
  #
  # publish:
  #   name: Publish to PyPI
  #   needs: build
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'release'
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/project/mypkg/
  #   permissions:
  #     id-token: write # trusted publishing; no API token needed
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist
  #     - uses: pypa/gh-action-pypi-publish@release/v1
